name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
jobs:
  release:
    name: letsgo
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: 0. letsgo reads the history from the API when a shallow
      # clone lacks it; the tag being released still has to be present.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # The compiler is a build input, so it is pinned by go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      # What is built and every plugin are letsgo.mod's to say.
      - uses: danielriddell21/letsgo-action@v1
